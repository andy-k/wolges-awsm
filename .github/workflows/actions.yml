name: Create and publish a Docker image
'on':
  push:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "${{ github.repository }}"
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    # the image is stamped with the commit it is built from, as wolges's release
    # names its files: <the commit's time in UTC>-<its short sha>
    - name: Stamp the commit
      id: stamp
      run: >-
        printf 'stamp=%s-%s\n'
        "$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y%m%dT%H%M%SZ)"
        "$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: "${{ env.REGISTRY }}"
        username: "${{ github.actor }}"
        password: "${{ secrets.GITHUB_TOKEN }}"
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        tags: |
          type=sha,prefix=,format=long
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: "."
        push: true
        tags: "${{ steps.meta.outputs.tags }}"
        labels: "${{ steps.meta.outputs.labels }}"
        build-args: "AWSM_VERSION=${{ steps.stamp.outputs.stamp }}"
